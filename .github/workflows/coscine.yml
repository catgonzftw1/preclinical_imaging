name: Deploy Coscine Static Site to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ vars.COSCINE_SUBPROJECT_NAME }}
      COSCINE_API_TOKEN: ${{ secrets.COSCINE_API_TOKEN }} 
    steps:
      - name: Check Python version
        run: python -V

      - name: Install git
        run: sudo apt install -y git

      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Copy webpage
        run: |
          pwd
          mkdir -p public/
          dir
          cp index.html public/
          cp style.css public/
          cp coscine_logo.gif public/

      - name: Clone repository
        run: git clone https://git.rwth-aachen.de/coscine/community-features/coscine-static-site-generator.git

      - name: Install requirements
        working-directory: ./coscine-static-site-generator/
        run: python -m pip install -r requirements.txt

      - name: Pin coscine SDK
        working-directory: ./coscine-static-site-generator/
        run: |
          # Install the exact SDK version without pulling newer dependencies
          python -m pip install --force-reinstall --no-deps coscine==0.11.12

      - name: Re‑pin urllib3 and requests to compatible versions
        working-directory: ./coscine-static-site-generator/
        run: |
          # Force‑install the versions that work with coscine 0.11.12, overriding any pre‑installed newer ones
          python -m pip install --upgrade --force-reinstall urllib3==1.26.16 requests==2.31.0

      - name: Clean workspace
        run: |
          echo "Cleaning workspace..."
          rm -rf ./public
          mkdir -p ./public

      - name: Copy webpage
        run: |
          pwd
          cp index.html public/
          cp style.css public/
          cp coscine_logo.gif public/
    
      - name: Build static site and generate navigation tabs
        working-directory: ./coscine-static-site-generator/
        run: |
          set -euo pipefail
          RESOURCE_NAMES=("Liver Imaging V8 S3" "ISA-tab templates")
      
          for RESOURCE in "${RESOURCE_NAMES[@]}"; do
            # turn spaces into underscores:
            SLUG=${RESOURCE// /_}
            echo "Running: python -m src -t [TOKEN] -p $PROJECT_NAME -r \"$RESOURCE\" -y -o ../public/$SLUG --subproject"
            python -m src -t "$COSCINE_API_TOKEN" -p "$PROJECT_NAME" -r "$RESOURCE" -y -o ../public/"$SLUG" --subproject || echo "⚠️ Failed for $RESOURCE"
            ls -l ../public/"$SLUG" || echo "⚠️ No output for $RESOURCE"
            ## echo "Processing resource: $RESOURCE → $SLUG"
            ## mkdir -p ../public/"$SLUG"
            ## python -m src -t "$COSCINE_API_TOKEN" -p "$PROJECT_NAME" -r "$RESOURCE" -y -o ../public/"$SLUG" --subproject
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
